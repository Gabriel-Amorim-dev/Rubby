<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" href="{{style}}">
</head>

<body>

<div id="scene">

    <div id="sun"></div>

    <div id="lake"></div>

    <div id="grass"></div>

    <div id="duckWrap">

        <div id="duckBob" class="walking">

            <img
                id="duck"

                src="{{duck}}"

                data-walk="{{duck}}"
                data-happy="{{happyDuck}}"
                data-scared="{{scaredDuck}}"
                data-sad="{{sadDuck}}"
                data-sleepy="{{sleepyDuck}}"
                data-cool="{{coolDuck}}"
                data-laughing="{{laughingDuck}}"

                alt="Rubber Duck"
            />

        </div>

    </div>

</div>

<script src="{{phrases}}"></script>
<script src="{{script}}"></script>

</body>
</html>
